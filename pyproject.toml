[project]
name = "smart-analyzer"
version = "0.2.0"
description = "Smart-voice daily log pull and latency analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.141.1",
    "great-tables>=0.24.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_analyzer"]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
