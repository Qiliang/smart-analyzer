[project]
name = "smart-analyzer"
version = "0.1.0"
description = "Smart-voice daily log pull and latency analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_analyzer"]

[tool.uv]
package = true
